# Throwaway One loop voice spike (design-one-loop.md, task 5): a tiny host app plus a
# hosted XCTest bundle that talks to real Gemini Live. Not part of the WukongMind app.
# It compiles the app's own Gemini Live wire code and voice tool texts unchanged.
name: OneLoopSpike
options:
  bundleIdPrefix: dev.wukongmind.oneloopspike
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  SpikeHost:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
  SpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - ../../../WukongMind/JSONValue.swift
      - ../../../WukongMind/Voice/LiveProtocol.swift
      - ../../../WukongMind/Voice/LiveTransport.swift
      - ../../../WukongMind/Voice/VoiceAudioFormat.swift
      - ../../../WukongMind/Voice/VoiceTools.swift
      - ../../../WukongMind/Voice/VoiceInstructions.swift
    dependencies:
      - target: SpikeHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SpikeTests:
    build:
      targets:
        SpikeHost: all
        SpikeTests: [test]
    test:
      targets: [SpikeTests]
