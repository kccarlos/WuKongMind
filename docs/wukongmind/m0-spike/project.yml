# Throwaway M0 spike: a tiny host app plus a hosted XCTest bundle.
# Not part of the WukongMind/Forumind app. Generate with xcodegen (run.sh does it).
name: M0Spike
options:
  bundleIdPrefix: dev.wukongmind.m0spike
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  SpikeHost:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  SpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SpikeHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SpikeTests:
    build:
      targets:
        SpikeHost: all
        SpikeTests: [test]
    test:
      targets: [SpikeTests]
