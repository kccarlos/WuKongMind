<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seal</title>
<style>
body{margin:0;padding:16px;background:var(--ground);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.c{display:flex;flex-direction:column;gap:12px;max-width:390px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font-family:inherit}
.mono{font-family:var(--font-mono)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.s{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:600}
.ink{background:var(--ink);color:var(--ground)}
.out{border:var(--hairline-width) solid var(--border-strong);color:var(--ink)}
.gw{background:var(--gold-wash);color:var(--gold-ink)}
.jw{background:var(--jade-wash);color:var(--jade)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.st .i,.s .i{width:14px;height:14px}

</style>
</head>
<body>
<div class="c" style="max-width:none">
<div class="r"><span class="s ink">Forum · 2 scripts</span><span class="s out">talk.example.org</span><span class="s gw">Claude Sonnet 5.5</span><span class="s gw">12 new</span><span class="s jw">Discourse</span></div>
<div class="r"><span class="st" style="color:var(--success)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg>On</span><span class="st" style="color:var(--warning)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></svg>Needs sign-in</span><span class="st" style="color:var(--danger)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></svg>Error</span><span class="st" style="color:var(--ink-muted)">Off</span></div>
</div>
</body>
</html>
