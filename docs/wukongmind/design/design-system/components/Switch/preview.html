<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switch</title>
<style>
body{margin:0;padding:16px;background:var(--ground);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.c{display:flex;flex-direction:column;gap:12px;max-width:390px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font-family:inherit}
.mono{font-family:var(--font-mono)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.sw{width:51px;height:31px;border-radius:var(--radius-full);border:0;position:relative;flex-shrink:0}
.on{background:var(--gold)}
.on span{position:absolute;top:3px;right:3px;width:25px;height:25px;border-radius:var(--radius-full);background:var(--on-gold)}
.off{background:var(--surface);border:var(--hairline-width) solid var(--border-strong)}
.off span{position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:var(--radius-full);background:var(--ink-muted)}

</style>
</head>
<body>
<div class="r" style="gap:24px"><label class="r" style="gap:8px;font-size:15px"><button class="sw on" role="switch" aria-checked="true" aria-label="Run scripts"><span></span></button>On</label><label class="r" style="gap:8px;font-size:15px"><button class="sw off" role="switch" aria-checked="false" aria-label="Confirm before writes"><span></span></button>Off</label></div>
</body>
</html>
