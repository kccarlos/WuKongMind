<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SuggestionRow</title>
<style>
body{margin:0;padding:16px;background:var(--ground);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.c{display:flex;flex-direction:column;gap:12px;max-width:390px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font-family:inherit}
.mono{font-family:var(--font-mono)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;max-width:390px}
.s{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:var(--radius-md);background:var(--surface);border:var(--hairline-width) solid var(--border-strong);color:var(--ink);font-size:15px;white-space:nowrap;flex-shrink:0}
.s .i{width:16px;height:16px;color:var(--gold-ink)}
.l{font-size:12px;font-weight:600;color:var(--ink-muted);margin:0 0 8px}

</style>
</head>
<body>
<p class="l">Forum topic</p>
<div class="row" role="group" aria-label="Suggestions"><button class="s"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg>Summarize this post and replies</button><button class="s"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16v-4a8 8 0 0 1 16 0v4"/><rect x="3" y="15" width="4" height="6" rx="1.5"/><rect x="17" y="15" width="4" height="6" rx="1.5"/></svg>Read it to me</button><button class="s"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M20 20l-5-5"/></svg>Search this forum…</button><button class="s"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Tell me about new replies</button></div>
<p class="l" style="margin-top:16px">Ordinary page</p>
<div class="row" role="group" aria-label="Suggestions"><button class="s"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg>Summarize this page</button><button class="s">Make it dark</button><button class="s">Remove the clutter</button></div>
</body>
</html>
