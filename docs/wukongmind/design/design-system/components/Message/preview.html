<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Message</title>
<style>
body{margin:0;padding:16px;background:var(--ground);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.c{display:flex;flex-direction:column;gap:12px;max-width:390px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font-family:inherit}
.mono{font-family:var(--font-mono)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.u{align-self:flex-end;max-width:82%;background:var(--surface-raised);color:var(--ink);padding:9px 14px;border-radius:var(--radius-lg) var(--radius-lg) var(--radius-sm) var(--radius-lg);font-size:15px;line-height:20px}
.a{font-size:15px;line-height:21px}
.n{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--gold-wash);color:var(--gold-ink);font-size:12px;font-weight:600;padding:5px 10px;border-radius:var(--radius-sm)}
.n .i{width:14px;height:14px}
.e{display:flex;gap:8px;align-items:flex-start;background:var(--cinnabar-wash);color:var(--ink);padding:10px 12px;border-radius:var(--radius-md);font-size:15px;line-height:20px}
.e .i{color:var(--danger);margin-top:1px}

</style>
</head>
<body>
<div class="c">
<div class="u">Summarize this post and replies</div>
<div class="a">Let me see how this site is laid out first. About half a minute.</div>
<div class="n"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 8a8.5 8.5 0 1 0 1 4"/></svg>Saved. Faster next time.</div>
<div class="e"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></svg><span>I couldn't search this forum: its search needs you to sign in first.</span></div>
</div>
</body>
</html>
