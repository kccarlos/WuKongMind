<!-- @dsCard group="Conversation" height=300 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ToolRow</title>
<style>
body{margin:0;padding:16px;background:var(--ground);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.c{display:flex;flex-direction:column;gap:12px;max-width:390px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button{font-family:inherit}
.mono{font-family:var(--font-mono)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.t{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:var(--hairline-width) solid var(--hairline)}
.t:first-child{border-top:0}
.g{width:28px;height:28px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-muted);background:var(--surface-raised)}
.g .i{width:15px;height:15px}
.run{background:none;border:var(--ring-width) solid var(--gold);border-right-color:var(--hairline);color:var(--gold-ink)}
.err{background:var(--cinnabar-wash);color:var(--danger)}
.m{flex:1;min-width:0;display:flex;flex-direction:column}
.nm{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ink)}
.ar{font-size:12px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.du{font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.fold{display:flex;align-items:center;gap:10px;background:var(--surface-raised);border-radius:var(--radius-md);padding:10px 12px;font-size:15px;font-weight:600}
.st{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-muted)}

</style>
</head>
<body>
<div class="c" style="gap:14px">
<div style="background:var(--surface);border:var(--hairline-width) solid var(--hairline);border-radius:var(--radius-lg);padding:2px 12px">
<div class="t"><span class="g"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg></span><div class="m"><span class="nm">read_page</span><span class="ar">structure summary · 3.1k characters</span></div><span class="du">0.4 s</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M9 6l6 6-6 6"/></svg></div>
<div class="t"><span class="g run" role="img" aria-label="Running"></span><div class="m"><span class="nm" style="color:var(--gold-ink)">run_js</span><span class="ar">Running…</span></div></div>
<div class="t"><span class="g err"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></svg></span><div class="m"><span class="nm">run_js</span><span class="ar" style="color:var(--danger)">Error · TypeError: posts is undefined</span></div><span class="du">0.1 s</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M9 6l6 6-6 6"/></svg></div>
</div>
<div class="fold"><span>Steps 5</span><span style="flex:1"></span><span class="du">1 error</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M6 9l6 6 6-6"/></svg></div>
<div class="st"><span style="color:var(--success);display:flex"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg></span><span style="flex:1">Done · 5 steps · 12 s</span><span class="mono" style="font-weight:400">8.2k tokens</span></div>
</div>
</body>
</html>
