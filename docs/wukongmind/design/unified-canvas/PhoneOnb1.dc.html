<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding step 1 pick a model</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.lt{--ground:#f7f3ea;--bg:#fffdf8;--page:#f7f3ea;--surface:#fffdf8;--raised:#efe9dc;--label:#1a1612;--sec:#5f574c;--ter:#756c5f;--border:rgba(26,22,18,.14);--strong:#8c8375;--blue:#8a6200;--purple:#8a6200;--gold:#b07f0c;--ongold:#1a1612;--goldwash:#f6ecd0;--teal:#1f6f66;--jade:#1f6f66;--jadewash:#dcefeb;--danger:#b3321f;--cin:#b3321f;--oncin:#ffffff;--cinwash:#f9e1da;--success:#356f1b;--warning:#a34a08;--fill:#efe9dc;--pop:#fffdf8;--toggleoff:#fffdf8;--bar:#fffdf8;--scrim:rgba(20,17,14,.4);--badgebg:#f6ecd0;--badgetx:#8a6200;--canvas:#e8e1d2;--kb:#d6d0c4;--key:#fffdf8}
.dk{--ground:#14110e;--bg:#1f1b16;--page:#14110e;--surface:#1f1b16;--raised:#2a251e;--label:#f4eee2;--sec:#b3a998;--ter:#8f8676;--border:rgba(244,238,226,.16);--strong:#7d7567;--blue:#e8bd55;--purple:#e8bd55;--gold:#e0b040;--ongold:#1a1612;--goldwash:#3a2f14;--teal:#6fd0c2;--jade:#6fd0c2;--jadewash:#12302c;--danger:#ff7a5c;--cin:#ff7a5c;--oncin:#1a1612;--cinwash:#3d1a12;--success:#8fd66b;--warning:#ffb070;--fill:#2a251e;--pop:#1f1b16;--toggleoff:#1f1b16;--bar:#1f1b16;--scrim:rgba(0,0,0,.5);--badgebg:#3a2f14;--badgetx:#e8bd55;--canvas:#0c0a08;--kb:#2a251e;--key:#4a433a}
.sf{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;color:var(--label);-webkit-font-smoothing:antialiased}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:4px;background:var(--ter);opacity:.4}
.sec{background:var(--surface);border-radius:14px;overflow:hidden}
.r{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;font-size:17px}
.r+.r{border-top:1px solid var(--border)}
.rad{width:22px;height:22px;border-radius:11px;border:2px solid var(--ter);box-sizing:border-box;flex-shrink:0}
</style>
</helmet>
<div class="sf {{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--page); display: flex; flex-direction: column;">
  <div style="display: flex; justify-content: center; gap: 8px; padding: 62px 0 0;"><span class="dot" style="background: var(--gold); opacity: 1; width: 22px;"></span><span class="dot"></span><span class="dot"></span></div>
  <div style="padding: 28px 24px 0; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center;">
    <div style="display: flex; align-items: center; gap: 10px;"><img src="../design-system/assets/Logo/mark.svg" alt="" style="width: 56px; height: 56px;"><span style="font-size: 22px; font-weight: 600;">WukongMind</span></div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700;">An agent for any web page</h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.4; color: var(--sec);">Pick a model for the Agent.</p>
  </div>
  <div style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 10px;">
    <div class="sec">
      <div class="r"><span class="rad" style="border: 7px solid var(--gold);"></span><span style="flex-grow: 1;">Anthropic</span></div>
      <div class="r" style="padding-left: 48px;"><label style="flex-grow: 1; display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; background: var(--fill);"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">API key</span><input type="password" value="••••••••••••••••" style="border: 0; background: none; font: inherit; font-size: 17px; outline: none; width: 100%; color: var(--label);"></label></div>
      <div class="r" style="padding-left: 48px;"><span style="flex-grow: 1;">Model</span><span style="color: var(--sec);">Claude Sonnet 5.5</span></div>
      <div class="r"><span class="rad"></span><span style="flex-grow: 1;">OpenRouter</span></div>
      <div class="r"><span class="rad"></span><span style="flex-grow: 1;">OpenAI</span></div>
      <div class="r"><span class="rad"></span><span style="flex-grow: 1;">Other provider…</span></div>
    </div>
    <div style="display: flex; gap: 8px; align-items: flex-start; padding: 0 8px; font-size: 13px; line-height: 1.35; color: var(--sec);"><svg class="ico" viewBox="0 0 24 24" style="width: 15px; height: 15px; margin-top: 1px;" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Keys stay in the Keychain</div>
  </div>
  <div style="flex-grow: 1;"></div>
  <div style="padding: 0 16px 34px; display: flex; flex-direction: column; gap: 4px;">
    <button style="min-height: 50px; border: 0; border-radius: 10px; background: var(--gold); color: var(--ongold); font: inherit; font-size: 17px; font-weight: 600;">Continue</button>
    <button style="min-height: 44px; border: 0; background: none; color: var(--blue); font: inherit; font-size: 17px;">Later</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["lt","dk"],"default":"lt"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'lt' }; }
}
</script>
</body>
</html>
