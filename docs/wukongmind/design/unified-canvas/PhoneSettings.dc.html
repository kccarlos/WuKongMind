<head>

<helmet>
<style>
body{margin:0}
.lt{--ground:#f7f3ea;--bg:#fffdf8;--page:#f7f3ea;--surface:#fffdf8;--raised:#efe9dc;--label:#1a1612;--sec:#5f574c;--ter:#756c5f;--border:rgba(26,22,18,.14);--strong:#8c8375;--blue:#8a6200;--purple:#8a6200;--gold:#b07f0c;--ongold:#1a1612;--goldwash:#f6ecd0;--teal:#1f6f66;--jade:#1f6f66;--jadewash:#dcefeb;--danger:#b3321f;--cin:#b3321f;--oncin:#ffffff;--cinwash:#f9e1da;--success:#356f1b;--warning:#a34a08;--fill:#efe9dc;--pop:#fffdf8;--toggleoff:#fffdf8;--bar:#fffdf8;--scrim:rgba(20,17,14,.4);--badgebg:#f6ecd0;--badgetx:#8a6200;--canvas:#e8e1d2;--kb:#d6d0c4;--key:#fffdf8}
.dk{--ground:#14110e;--bg:#1f1b16;--page:#14110e;--surface:#1f1b16;--raised:#2a251e;--label:#f4eee2;--sec:#b3a998;--ter:#8f8676;--border:rgba(244,238,226,.16);--strong:#7d7567;--blue:#e8bd55;--purple:#e8bd55;--gold:#e0b040;--ongold:#1a1612;--goldwash:#3a2f14;--teal:#6fd0c2;--jade:#6fd0c2;--jadewash:#12302c;--danger:#ff7a5c;--cin:#ff7a5c;--oncin:#1a1612;--cinwash:#3d1a12;--success:#8fd66b;--warning:#ffb070;--fill:#2a251e;--pop:#1f1b16;--toggleoff:#1f1b16;--bar:#1f1b16;--scrim:rgba(0,0,0,.5);--badgebg:#3a2f14;--badgetx:#e8bd55;--canvas:#0c0a08;--kb:#2a251e;--key:#4a433a}
.sf{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;color:var(--label);-webkit-font-smoothing:antialiased}
.ico{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sh{font-size:13px;color:var(--sec);padding:0 16px 6px;text-transform:uppercase;letter-spacing:.02em}
.sec{background:var(--surface);border-radius:14px;overflow:hidden}
.r{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;text-decoration:none;color:var(--label)}
.r+.r .t{border-top:1px solid var(--border)}
.t{flex-grow:1;display:flex;align-items:center;gap:8px;min-height:44px;font-size:17px}
.v{margin-left:auto;font-size:17px;color:var(--sec)}
.ic{width:29px;height:29px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ground);background:var(--label);flex-shrink:0}
.ch{width:8px;height:13px;color:var(--ter)}
</style>
</helmet>

        <a class="r" href="#"><span class="ic"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4c-2 0-2 1.5-2 3v2c0 1.5-1 2-2 2 1 0 2 .5 2 2v3c0 1.5 0 3 2 3M15 4c2 0 2 1.5 2 3v2c0 1.5 1 2 2 2-1 0-2 .5-2 2v3c0 1.5 0 3-2 3"/></svg></span><span class="t">Scripts &amp; tools<span class="v">4</span><svg class="ch" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 1l5.5 5.5L1 12"/></svg></span></a>
      </div>
    </div>
    <div>

        <a class="r" href="#"><span class="ic"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><span class="t">Sites<span class="v">3 forums</span><svg class="ch" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 1l5.5 5.5L1 12"/></svg></span></a>
        <a class="r" href="#"><span class="ic"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span><span class="t">Browser<span class="v">Google</span><svg class="ch" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 1l5.5 5.5L1 12"/></svg></span></a>
      </div>
    </div>
    <div>
      <div class="sh">Voice &amp; digest</div>
      <div class="sec">
        <a class="r" href="#"><span class="ic"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg></span><span class="t">Voice<span class="v">On</span><svg class="ch" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 1l5.5 5.5L1 12"/></svg></span></a>
        <a class="r" href="#"><span class="ic"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></span><span class="t">Daily digest &amp; podcast<span class="v">On</span><svg class="ch" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 1l5.5 5.5L1 12"/></svg></span></a>
      </div>
    </div>
    <div>
      <div class="sh">Your data</div>

        <a class="r" href="#"><span class="ic"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z"/></svg></span><span class="t">iCloud Sync<span class="v">On</span><svg class="ch" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 1l5.5 5.5L1 12"/></svg></span></a>
        <a class="r" href="#"><span class="ic"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-12 4l-2-4a1.5 1.5 0 0 1 2.5-1.5L8 15"/></svg></span><span class="t">Data &amp; privacy<svg class="ch" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="margin-left: auto;"><path d="M1 1l5.5 5.5L1 12"/></svg></span></a>
      </div>
    </div>
    <div class="sec">
      <a class="r" href="#"><span class="ic"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01"/></svg></span><span class="t">Help &amp; about<svg class="ch" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="margin-left: auto;"><path d="M1 1l5.5 5.5L1 12"/></svg></span></a>

  </div>
</div>
</x-dc>
