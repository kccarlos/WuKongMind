<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding on iPad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.lt{--ground:#f7f3ea;--bg:#fffdf8;--page:#f7f3ea;--surface:#fffdf8;--raised:#efe9dc;--label:#1a1612;--sec:#5f574c;--ter:#756c5f;--border:rgba(26,22,18,.14);--strong:#8c8375;--blue:#8a6200;--purple:#8a6200;--gold:#b07f0c;--ongold:#1a1612;--goldwash:#f6ecd0;--teal:#1f6f66;--jade:#1f6f66;--jadewash:#dcefeb;--danger:#b3321f;--cin:#b3321f;--oncin:#ffffff;--cinwash:#f9e1da;--success:#356f1b;--warning:#a34a08;--fill:#efe9dc;--pop:#fffdf8;--toggleoff:#fffdf8;--bar:#fffdf8;--scrim:rgba(20,17,14,.4);--badgebg:#f6ecd0;--badgetx:#8a6200;--canvas:#e8e1d2;--kb:#d6d0c4;--key:#fffdf8;--web:#E9E9EE}
.dk{--ground:#14110e;--bg:#1f1b16;--page:#14110e;--surface:#1f1b16;--raised:#2a251e;--label:#f4eee2;--sec:#b3a998;--ter:#8f8676;--border:rgba(244,238,226,.16);--strong:#7d7567;--blue:#e8bd55;--purple:#e8bd55;--gold:#e0b040;--ongold:#1a1612;--goldwash:#3a2f14;--teal:#6fd0c2;--jade:#6fd0c2;--jadewash:#12302c;--danger:#ff7a5c;--cin:#ff7a5c;--oncin:#1a1612;--cinwash:#3d1a12;--success:#8fd66b;--warning:#ffb070;--fill:#2a251e;--pop:#1f1b16;--toggleoff:#1f1b16;--bar:#1f1b16;--scrim:rgba(0,0,0,.5);--badgebg:#3a2f14;--badgetx:#e8bd55;--canvas:#0c0a08;--kb:#2a251e;--key:#4a433a;--web:#16171A}
.sf{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;color:var(--label);-webkit-font-smoothing:antialiased}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:4px;background:var(--ter);opacity:.4}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;text-decoration:none;color:var(--label)}
.ti{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:22px;font-weight:700;position:relative}
.bd{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:10px;background:#48484A;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--page)}
</style>
</helmet>
<div class="sf {{theme}}" style="width: 1194px; height: 834px; position: relative; overflow: hidden; background: var(--web);">
  <div style="position: absolute; inset: 0; background: var(--scrim);"></div>
  <div role="dialog" aria-label="Welcome" style="position: absolute; left: 327px; top: 107px; width: 540px; height: 620px; border-radius: 16px; background: var(--page); display: flex; flex-direction: column; overflow: hidden;">
    <div style="display: flex; justify-content: center; gap: 8px; padding: 24px 0 0;"><span class="dot"></span><span class="dot" style="background: var(--gold); opacity: 1; width: 22px;"></span><span class="dot"></span></div>
    <div style="padding: 24px 40px 0; display: flex; flex-direction: column; gap: 8px; text-align: center;">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700;">Open a site</h1>
      <p style="margin: 0; font-size: 17px; color: var(--sec);">Any address works.</p>
    </div>
    <div style="padding: 24px 40px 0; display: flex; flex-direction: column; gap: 24px;">
      <label style="display: flex; align-items: center; gap: 8px; min-height: 50px; padding: 0 14px; border-radius: 12px; background: var(--surface); color: var(--sec);"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M20 20l-5-5"/></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Address</span><input placeholder="Search or enter address" style="border: 0; background: none; font: inherit; font-size: 17px; outline: none; width: 100%; color: var(--label);"></label>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px;">
        <a class="tile" href="#"><span class="ti" style="background: #0E8A7E;">H</span>Home Lab Talk</a>
        <a class="tile" href="#"><span class="ti" style="background: #E06A1B;">Y</span>Hacker News</a>
        <a class="tile" href="#"><span class="ti" style="background: #7A2E1F;">N</span>Northwind</a>
        <a class="tile" href="#"><span class="ti" style="background: #3A5BE0;">D</span>Docs</a>
      </div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="padding: 0 40px 28px; display: flex; gap: 12px;">
      <button style="flex: 1; min-height: 50px; border: 0; border-radius: 14px; background: var(--surface); color: var(--blue); font: inherit; font-size: 17px;">Back</button>
      <button style="flex: 2; min-height: 50px; border: 0; border-radius: 10px; background: var(--gold); color: var(--ongold); font: inherit; font-size: 17px; font-weight: 600;">Open</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["lt","dk"],"default":"lt"},"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'lt' }; }
}
</script>
</body>
</html>
