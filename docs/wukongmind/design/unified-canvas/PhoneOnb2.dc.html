<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding step 2 open a site</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.lt{--ground:#f7f3ea;--bg:#fffdf8;--page:#f7f3ea;--surface:#fffdf8;--raised:#efe9dc;--label:#1a1612;--sec:#5f574c;--ter:#756c5f;--border:rgba(26,22,18,.14);--strong:#8c8375;--blue:#8a6200;--purple:#8a6200;--gold:#b07f0c;--ongold:#1a1612;--goldwash:#f6ecd0;--teal:#1f6f66;--jade:#1f6f66;--jadewash:#dcefeb;--danger:#b3321f;--cin:#b3321f;--oncin:#ffffff;--cinwash:#f9e1da;--success:#356f1b;--warning:#a34a08;--fill:#efe9dc;--pop:#fffdf8;--toggleoff:#fffdf8;--bar:#fffdf8;--scrim:rgba(20,17,14,.4);--badgebg:#f6ecd0;--badgetx:#8a6200;--canvas:#e8e1d2;--kb:#d6d0c4;--key:#fffdf8}
.dk{--ground:#14110e;--bg:#1f1b16;--page:#14110e;--surface:#1f1b16;--raised:#2a251e;--label:#f4eee2;--sec:#b3a998;--ter:#8f8676;--border:rgba(244,238,226,.16);--strong:#7d7567;--blue:#e8bd55;--purple:#e8bd55;--gold:#e0b040;--ongold:#1a1612;--goldwash:#3a2f14;--teal:#6fd0c2;--jade:#6fd0c2;--jadewash:#12302c;--danger:#ff7a5c;--cin:#ff7a5c;--oncin:#1a1612;--cinwash:#3d1a12;--success:#8fd66b;--warning:#ffb070;--fill:#2a251e;--pop:#1f1b16;--toggleoff:#1f1b16;--bar:#1f1b16;--scrim:rgba(0,0,0,.5);--badgebg:#3a2f14;--badgetx:#e8bd55;--canvas:#0c0a08;--kb:#2a251e;--key:#4a433a}
.sf{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;color:var(--label);-webkit-font-smoothing:antialiased}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:4px;background:var(--ter);opacity:.4}
.sec{background:var(--surface);border-radius:14px;overflow:hidden}
.r{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 14px;text-decoration:none;color:var(--label)}
.r+.r{border-top:1px solid var(--border)}
.ti{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-weight:700;position:relative;flex-shrink:0}
.bd{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:9px;background:#48484A;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)}
.nm{flex-grow:1;display:flex;flex-direction:column}
.nm b{font-size:17px;font-weight:400}
.nm span{font-size:13px;color:var(--sec)}
</style>
</helmet>
<div class="sf {{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--page); display: flex; flex-direction: column;">
  <div style="display: flex; justify-content: center; gap: 8px; padding: 62px 0 0;"><span class="dot"></span><span class="dot" style="background: var(--gold); opacity: 1; width: 22px;"></span><span class="dot"></span></div>
  <div style="padding: 28px 24px 0; display: flex; flex-direction: column; gap: 10px; text-align: center;">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700;">Open a site</h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.4; color: var(--sec);">Any address works.</p>
  </div>
  <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 18px;">
    <label style="display: flex; align-items: center; gap: 8px; min-height: 50px; padding: 0 14px; border-radius: 12px; background: var(--surface); color: var(--sec);">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M20 20l-5-5"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Address</span>
      <input placeholder="Search or enter address" style="border: 0; background: none; font: inherit; font-size: 17px; outline: none; width: 100%; color: var(--label);">
    </label>
    <div>
      <div style="font-size: 13px; color: var(--sec); padding: 0 16px 6px; text-transform: uppercase;">Suggested</div>
      <div class="sec">
        <a class="r" href="#"><span class="ti" style="background: #0E8A7E;">H</span><span class="nm"><b>Home Lab Talk</b><span>Home servers and networking</span></span></a>
        <a class="r" href="#"><span class="ti" style="background: #E06A1B;">Y</span><span class="nm"><b>Hacker News</b><span>Tech news and discussion</span></span></a>
        <a class="r" href="#"><span class="ti" style="background: #7A2E1F;">N</span><span class="nm"><b>Northwind Gazette</b><span>News site</span></span></a>
        <a class="r" href="#"><span class="ti" style="background: #3A5BE0;">D</span><span class="nm"><b>Docs</b><span>Reference site</span></span></a>
      </div>
    </div>
  </div>
  <div style="flex-grow: 1;"></div>
  <div style="padding: 0 16px 34px; display: flex; flex-direction: column; gap: 4px;">
    <button style="min-height: 50px; border: 0; border-radius: 10px; background: var(--gold); color: var(--ongold); font: inherit; font-size: 17px; font-weight: 600;">Open</button>
    <button style="min-height: 44px; border: 0; background: none; color: var(--blue); font: inherit; font-size: 17px;">Back</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["lt","dk"],"default":"lt"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { theme: this.props.theme ?? 'lt' }; }
}
</script>
</body>
</html>
