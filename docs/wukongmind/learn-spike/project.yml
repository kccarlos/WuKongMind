# Throwaway Learn on ask spike (design-learn-on-ask.md, task 1).
name: LearnSpike
options:
  bundleIdPrefix: dev.wukongmind.learnspike
  deploymentTarget: { iOS: "17.0" }
settings:
  base: { SWIFT_VERSION: "5.0", SWIFT_STRICT_CONCURRENCY: minimal, ENABLE_TESTABILITY: YES, CODE_SIGN_STYLE: Automatic }
targets:
  SpikeHost:
    type: application
    platform: iOS
    sources:
      - path: Host
      - path: ../../../WukongMind
        excludes: ["WukongMindApp.swift", "*.xcstrings", "Assets.xcassets", "ContentBlocking", "Info.plist", "*.entitlements", "*.xcprivacy", "Generated/**"]
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest: { UIApplicationSupportsMultipleScenes: false }
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true, NSAllowsArbitraryLoads: true }
  SpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: SpikeHost }]
    settings: { base: { GENERATE_INFOPLIST_FILE: YES } }
schemes:
  SpikeTests:
    build: { targets: { SpikeHost: all, SpikeTests: [test] } }
    test: { targets: [SpikeTests] }
