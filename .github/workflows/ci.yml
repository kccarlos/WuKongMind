name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: WukongMind.xcodeproj
  SCHEME: WukongMind
  # Matches the local toolchain (Xcode 27.2, 27B52). To fall back to the GA
  # macOS 26 image, set repo variables CI_MACOS_RUNNER=macos-26 and
  # CI_XCODE_APP=/Applications/Xcode_26.6.app.
  XCODE_APP: ${{ vars.CI_XCODE_APP || '/Applications/Xcode_27.2.app' }}

jobs:
  # Cheap checks on Linux (macOS minutes are billed at a multiplier).
  lint:
    name: Lint (plists, scripts, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Lint property lists
        run: scripts/ci/lint-plists.sh
      - name: ShellCheck CI scripts
        run: shellcheck scripts/ci/*.sh scripts/adblock/*.sh
      - name: Fastfile syntax
        run: ruby -c fastlane/Fastfile
      - name: Ad-blocking converter tests
        # Rust syntax-case tests (adblock-rust, build-time only) + Python
        # validator/chunking tests. ubuntu-latest ships cargo and python3.
        run: scripts/adblock/run_tests.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

  project-drift:
    name: Generated project is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document
      - name: Compare committed project with generator output
        # Fails on drift; the log shows a UUID-free diff of what changed.
        run: scripts/ci/check-project-drift.sh
      - name: Site layering (only WukongMind/Sites/ knows a platform)
        # Fails on a new platform-specific hit outside Sites/ and on a stale
        # entry in scripts/ci/site-layering-allowlist.txt.
        run: scripts/ci/check-site-layering.sh

  # Unit and UI tests run as two parallel jobs, each building in place (a
  # shared build-for-testing artifact was tried and failed: simulator UDIDs
  # differ per runner and the products handoff stalled). Required check name
  # stays "Build & unit tests"; add "UI tests" as a required check too.
  build-test:
    name: Build & unit tests
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh
      - name: Pick simulator
        id: sim
        env:
          SIM_PREFER: iPhone 17 Pro,iPhone 18 Pro,iPhone 17,iPhone Air
        run: scripts/ci/pick-simulator.sh
      - name: Unit tests
        env:
          DESTINATION: ${{ steps.sim.outputs.destination }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
        run: |
          set -o pipefail
          formatter=(cat)
          if command -v xcbeautify >/dev/null; then formatter=(xcbeautify --renderer github-actions); fi
          # One retry only: the unit suite has a rare flake; UI tests get 3.
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:WukongMindTests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 300 \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | "${formatter[@]}"
      - name: Flaky tests (passed on retry)
        # Never fails the job: a missing or unreadable result only gets a note.
        if: always()
        run: scripts/ci/flaky-summary.sh TestResults.xcresult >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-unit-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore

  ui-tests:
    name: UI tests
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh
      - name: Pick simulator
        id: sim
        env:
          SIM_PREFER: iPhone 17 Pro,iPhone 18 Pro,iPhone 17,iPhone Air
        run: scripts/ci/pick-simulator.sh
      - name: Boot simulator
        # A cold simulator made the UI runner fail to launch ("Lost pending
        # connection to the test runner before launch").
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: UI tests
        env:
          DESTINATION: ${{ steps.sim.outputs.destination }}
        run: |
          set -o pipefail
          formatter=(cat)
          if command -v xcbeautify >/dev/null; then formatter=(xcbeautify --renderer github-actions); fi
          # Fast offline UI suites; 6-11m multi-launch suites, xctrace perf
          # loops and live meta.discourse.org suites stay manual.
          run_ui() {
            xcodebuild test \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -destination "$DESTINATION" \
              -only-testing:WukongMindUITests/SuggestionRowUITests \
              -only-testing:WukongMindUITests/ScriptManagerUITests \
              -parallel-testing-enabled NO \
              -retry-tests-on-failure \
              -test-iterations 3 \
              -test-timeouts-enabled YES \
              -maximum-test-execution-time-allowance 300 \
              -derivedDataPath DerivedData \
              -resultBundlePath TestResults.xcresult \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              2>&1 | tee ui.log | "${formatter[@]}"
          }
          # Retry the whole step once, only when the runner never launched.
          run_ui || { grep -q "Lost pending connection to the test runner" ui.log && rm -rf TestResults.xcresult && run_ui; }
      - name: Flaky tests (passed on retry)
        # Never fails the job: a missing or unreadable result only gets a note.
        if: always()
        run: scripts/ci/flaky-summary.sh TestResults.xcresult >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-ui-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore

  release-build:
    # Catches Release-only compile errors (for example code behind `#if DEBUG`
    # that Release still references) without any signing material.
    name: Release build (device, unsigned)
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Build Release for generic iOS
        run: |
          set -o pipefail
          formatter=(cat)
          if command -v xcbeautify >/dev/null; then formatter=(xcbeautify --renderer github-actions); fi
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | "${formatter[@]}"
