name: CI

# Tiers (docs/CI.md):
#   pull_request    lint, project drift, then one build and 2 test jobs: unit
#                   tests in two halves, a UI smoke set with the lighter half.
#                   At most 3 macOS jobs per run (the free plan runs 5 at once).
#   push to main, tags v*, nightly, manual (tier "full" by default)
#                   the whole unit suite, the CI UI suites in two shards, and
#                   the unsigned Release build.
# Require only the summary check "CI": the other check names follow the tier.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '41 7 * * *' # nightly 07:41 UTC, full tier
  workflow_dispatch:
    inputs:
      tier:
        description: 'pr (what a pull request runs) or full (main, tags, nightly)'
        type: choice
        options: [full, pr]
        default: full

# Pull requests cancel a superseded run. On main and tags the running run
# finishes and only the newest waiting one is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PROJECT: WukongMind.xcodeproj
  SCHEME: WukongMind
  # Matches the local toolchain (Xcode 27.2, 27B52). To fall back to the GA
  # macOS 26 image, set repo variables CI_MACOS_RUNNER=macos-26 and
  # CI_XCODE_APP=/Applications/Xcode_26.6.app.
  XCODE_APP: ${{ vars.CI_XCODE_APP || '/Applications/Xcode_27.2.app' }}

jobs:
  # Cheap checks on Linux (macOS minutes are billed at a multiplier).
  lint:
    name: Lint (plists, scripts, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Lint property lists
        run: scripts/ci/lint-plists.sh
      - name: ShellCheck CI scripts
        run: shellcheck scripts/ci/*.sh scripts/adblock/*.sh
      - name: Fastfile syntax
        run: ruby -c fastlane/Fastfile
      - name: Ad-blocking converter tests
        # Rust syntax-case tests (adblock-rust, build-time only) + Python
        # validator/chunking tests. ubuntu-latest ships cargo and python3.
        run: scripts/adblock/run_tests.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

  project-drift:
    name: Generated project is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document
      - name: Compare committed project with generator output
        # Fails on drift; the log shows a UUID-free diff of what changed.
        run: scripts/ci/check-project-drift.sh
      - name: Site layering (only WukongMind/Sites/ knows a platform)
        # Fails on a new platform-specific hit outside Sites/ and on a stale
        # entry in scripts/ci/site-layering-allowlist.txt.
        run: scripts/ci/check-site-layering.sh

  changes:
    name: Plan (tier, docs-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      code: ${{ steps.plan.outputs.code }}
      release: ${{ steps.plan.outputs.release }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # History without file contents: enough for git diff --name-only.
          fetch-depth: 0
          filter: blob:none
      - name: Plan the run
        id: plan
        # Docs-only pull requests (*.md, docs/**, images) skip the macOS jobs,
        # but the workflow still starts and "CI" still reports (paths-ignore
        # would show no run at all).
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TIER_INPUT: ${{ inputs.tier }}
        run: scripts/ci/plan.sh

  # Builds the app and both test bundles once; the test jobs run
  # test-without-building on their own runner and simulator.
  build:
    name: Build for testing
    needs: [lint, project-drift, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh
      - name: Pick simulator
        id: sim
        env:
          SIM_PREFER: iPhone 17 Pro,iPhone 18 Pro,iPhone 17,iPhone Air
        run: scripts/ci/pick-simulator.sh
      - name: Build for testing
        env:
          DESTINATION: ${{ steps.sim.outputs.destination }}
        run: scripts/ci/build-for-testing.sh
      - name: Raw xcodebuild tail
        if: failure()
        run: tail -n 60 build.log || true
      - name: Upload test products
        uses: actions/upload-artifact@v7
        with:
          name: test-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-products.zip
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  test:
    name: ${{ matrix.name }}
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: scripts/ci/select-xcode.sh
      # Download before picking and booting: a booting simulator slowed the
      # download and unzip to minutes (3-vCPU runners; tried in WUKO-125 and
      # WUKO-128).
      - name: Download test products
        uses: actions/download-artifact@v7
        with:
          name: test-products-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Unpack test products
        run: |
          mkdir -p DerivedData/Build/Products
          unzip -q test-products.zip -d DerivedData/Build/Products
          rm test-products.zip
      - name: Pick simulator
        id: sim
        env:
          SIM_PREFER: iPhone 17 Pro,iPhone 18 Pro,iPhone 17,iPhone Air
        run: scripts/ci/pick-simulator.sh
      - name: Boot simulator
        # A cold simulator made the UI runner fail to launch ("Lost pending
        # connection to the test runner before launch").
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Tests
        env:
          DESTINATION: ${{ steps.sim.outputs.destination }}
          # Runtime only (never in the build or the products artifact);
          # empty for fork pull requests, and those live tests skip.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
        run: scripts/ci/run-tests.sh "${{ matrix.shard }}"
      - name: Raw xcodebuild tail
        # The beautifier hides why xcodebuild exited early; show the raw end.
        if: failure()
        run: tail -n 60 tests.log || true
      - name: Test start-up timeline
        # Where the minutes before the first test went. On a fresh simulator
        # WebKit's first launch takes 1-2 min ("GPU process took 95 seconds").
        if: always()
        run: grep -m 8 -E "Command line invocation|Test Suite 'Selected tests' started|process .* took [0-9.]+ seconds to launch|\*\* TEST" tests.log || true
      - name: Flaky tests (passed on retry)
        # Never fails the job: a missing or unreadable result only gets a note.
        if: always()
        run: scripts/ci/flaky-summary.sh TestResults.xcresult >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: ignore

  release-build:
    # Catches Release-only compile errors (for example code behind `#if DEBUG`
    # that Release still references) without any signing material. Full tier
    # only: it failed once in 369 PR runs, and it would be a 4th macOS job.
    name: Release build (device, unsigned)
    needs: [lint, project-drift, changes]
    if: needs.changes.outputs.release == 'true'
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Build Release for generic iOS
        run: |
          set -o pipefail
          formatter=(cat)
          if command -v xcbeautify >/dev/null; then formatter=(xcbeautify --renderer github-actions); fi
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | "${formatter[@]}"

  # The one check to require: its name stays the same whatever the tier and
  # shards. Skipped jobs pass (docs-only, PR tier); failed or cancelled fail.
  ci:
    name: CI
    if: always()
    needs: [lint, project-drift, changes, build, test, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          TIER: ${{ needs.changes.outputs.tier }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "tier=$TIER code=$CODE results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job ended '$r'"; exit 1 ;;
            esac
          done
