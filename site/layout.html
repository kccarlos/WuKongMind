<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="WukongMind">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<link rel="icon" href="{{root}}assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}assets/icon-180.png">
<link rel="stylesheet" href="{{root}}styles.css">
{{head_extra}}</head>
<body>
<a class="skip" href="#main">{{skip}}</a>
<header class="bar">
  <a class="brand" href="{{home}}"><img src="{{root}}assets/mark.svg" alt="" width="28" height="28"><span>WukongMind</span></a>
  <nav aria-label="{{nav_label}}">
{{nav}}
  </nav>
  <nav class="langs" aria-label="{{lang_label}}">
    <details>
      <summary><svg class="globe" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span class="sr-only">{{lang_label}}: </span><span>{{lang_short}}</span><svg class="chev" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></summary>
      <div class="lang-menu">
{{langs}}
      </div>
    </details>
  </nav>
</header>
<main id="main">
{{body}}
</main>
<footer>
  <nav aria-label="{{footer_label}}">
{{footer_nav}}
  </nav>
  <p>{{footer_note}}</p>
</footer>
<script>(function(){var d=document.querySelector(".langs details");if(!d)return;document.addEventListener("keydown",function(e){if(e.key==="Escape"&&d.open){d.open=false;d.querySelector("summary").focus()}});document.addEventListener("click",function(e){if(d.open&&!d.contains(e.target))d.open=false})})();</script>
{{body_end}}</body>
</html>
